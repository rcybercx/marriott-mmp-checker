name: Public Marriott Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-test.yml'
      - 'src/public-check.mjs'
  workflow_dispatch:

jobs:
  test-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run public no-login Marriott test
        env:
          TEST_NOTIFICATION: 'true'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/public-check.mjs
