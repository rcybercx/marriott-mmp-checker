name: Public Marriott Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-test.yml'
      - 'src/public-check.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  test-public-search:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browserless Marriott test
        env:
          TEST_NOTIFICATION: 'true'
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run test:public

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marriott-public-test-${{ github.run_number }}
          path: artifacts/public-test/
          if-no-files-found: warn
          retention-days: 7
